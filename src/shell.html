<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어 Anki">
<!--PWA-->
<title>영어 문장 Anki</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2128;--mut:#6b7380;--line:#e3e6ea;--pri:#1f6feb;--blue:#1f6feb;--red:#d1242f;--green:#1a7f37;--amber:#bf8700;--cz:#fff3c4;--focus:#eef4ff;}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--pri:#4493f8;--blue:#4493f8;--red:#f85149;--green:#3fb950;--amber:#d29922;--cz:#3d3415;--focus:#14233d;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 92px)}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:.2em 0 .6em}h3{font-size:15px;margin:0 0 .6em}
.title{margin:6px 2px 12px}.sub{margin:2px 0 8px;color:var(--mut);font-size:13px}
.hero{padding:6px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.center{text-align:center}.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.row.between{justify-content:space-between;margin-top:0;flex-wrap:wrap;column-gap:12px;row-gap:2px}.row.center{justify-content:center}
.muted{color:var(--mut)}.small{font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.danger{color:var(--red);border-color:var(--red)}.btn.ghost{background:transparent}
.btn.big{width:100%;padding:14px;font-size:17px}.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;padding:4px 6px;cursor:pointer}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--mut)}.badge.ok{background:rgba(26,127,55,.12);color:var(--green)}.badge.warn{background:rgba(191,135,0,.15);color:var(--amber)}
.nums{display:flex;justify-content:space-around;margin-bottom:14px;text-align:center}.nums b{display:block;font-size:30px;line-height:1.1}.nums span{font-size:12px;color:var(--mut)}
.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--green));min-width:2px}
.spark{display:flex;align-items:flex-end;gap:4px;height:70px}.spark>i{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.est{margin:8px 0 0;color:var(--fg)}
.chart svg{display:block;width:100%;height:150px;border-bottom:1px solid var(--line)}.chart .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:2px 0}
.chart .cum{fill:var(--mut);opacity:.15}.chart .cumv{opacity:.85}
.lrn{fill:#f0a35e;background:#f0a35e}.rel{fill:var(--red);background:var(--red)}.yng{fill:#8fd19e;background:#8fd19e}.mat{fill:var(--green);background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}.kv dt{color:var(--mut);text-align:right}.kv dd{margin:0;font-weight:600}
.spark.f{height:96px}.spark.f>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.spark.f i{display:block;width:70%;background:var(--green);border-radius:3px 3px 0 0;min-height:2px}.spark.f small{font-size:10px;color:var(--mut)}
.guide summary{font-weight:600;cursor:pointer}.guide ol{padding-left:20px;margin:10px 0 0}.guide li{margin-bottom:8px;font-size:14px}
.empty p{font-size:14px}.remind{border-color:var(--amber)}.remind p{margin:4px 0 0}
/* review */
.rtop{display:flex;align-items:center;gap:6px;font-weight:700;padding:0 4px 8px}.spacer{flex:1}
.face{min-height:46vh;display:flex;flex-direction:column;gap:12px;justify-content:center}
.kind{font-size:12px;color:var(--mut);letter-spacing:.02em}
.en{font-size:19px}.en.big{font-size:23px;line-height:1.45}.ko{color:var(--mut);font-size:16px}.ko.big{font-size:21px;color:var(--fg)}
.extra{font-size:14px;border-top:1px dashed var(--line);padding-top:10px;color:var(--mut)}.src{font-size:12px;color:var(--mut);text-align:right}
.para{font-size:18px;line-height:1.7}.para .ctx{color:var(--mut)}.para .focus{background:var(--focus);border-radius:6px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cz{background:var(--cz);border-radius:5px;padding:0 4px;font-weight:700;color:var(--blue)}.cz.on{color:var(--green)}
.ans{font-size:20px}
.say{border:0;background:var(--focus);border-radius:999px;width:36px;height:36px;font-size:17px;vertical-align:middle;cursor:pointer;margin-right:4px}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--mut)}
textarea,input,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}input[type=range]{padding:0;border:0;background:none}
.diff span{padding:0 1px}.diff .ok{color:var(--green)}.diff .miss{color:var(--red);text-decoration:underline;font-weight:700}.diff .extra{color:var(--mut);text-decoration:line-through;border:0;padding:0}
.leech{font-size:13px;color:var(--amber)}
.note{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--focus)}.note.warn{background:rgba(191,135,0,.13);color:var(--fg)}
.tip.warn{color:var(--amber);font-weight:600}.tag.amber{background:rgba(191,135,0,.15);color:var(--amber)}
.answer.fg .grade{flex:0 0 26%}.answer .show{flex:1;font-size:17px}
.introbadge{font-size:13px;color:var(--blue);font-weight:600}.intro{border-color:var(--blue)}
.answer .known{flex:0 0 32%}.slowmsg{color:var(--amber)}.grade.good.slow{background:#9a6b00}
.recbar{display:flex;gap:8px;flex-wrap:wrap}.recbar .btn{padding:8px 12px;font-size:14px}.recording{color:var(--red);border-color:var(--red)!important}
.check{font-size:12px;color:var(--mut);text-align:center;margin:-4px 0 10px}
.answer{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;gap:8px;background:var(--bg);padding:8px 0}
.grade{flex:1;border:0;border-radius:12px;padding:10px 4px;font:inherit;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.grade small{font-weight:500;font-size:12px;opacity:.9}.grade.again{background:var(--red)}.grade.hard{background:#6e7781}.grade.good{background:var(--green)}.grade.easy{background:var(--blue)}
/* forms */
.form label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}.form label.chk{display:flex;align-items:center;font-weight:500}
.tip{font-size:13px;color:var(--mut);margin:-4px 0 12px}.row+.tip,.btn+.tip{margin-top:10px}
code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.small button{font-size:13px;padding:6px 2px}
.chips{line-height:2.3;font-size:17px;margin-bottom:14px}.chip{padding:3px 4px;border-radius:6px;cursor:pointer;border-bottom:2px dotted var(--line)}.chip.sel{background:var(--cz);color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}
/* list */
.list{list-style:none;padding:0;margin:0}.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.en1{font-size:15px}.ko1{font-size:13px;color:var(--mut)}.tags{margin-top:4px;font-size:11px}.k{color:var(--mut);margin-right:2px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--mut);margin-right:6px}.tag.blue{background:rgba(31,111,235,.13);color:var(--blue)}.tag.red{background:rgba(209,36,47,.12);color:var(--red)}.tag.green{background:rgba(26,127,55,.12);color:var(--green)}
#q{margin-bottom:10px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button b{font-size:20px;font-weight:400;line-height:1.2}nav button.on{color:var(--pri);font-weight:700}
/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}.sheet label.chk{display:flex;align-items:center}.mtext{font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(env(safe-area-inset-bottom) + 84px);background:#1c2128;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;display:flex;gap:10px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast button{background:none;border:0;color:#7fb4ff;font:inherit;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-v="home"><b>⌂</b>홈</button>
  <button data-v="review"><b>↻</b>복습</button>
  <button data-v="add"><b>＋</b>추가</button>
  <button data-v="browse"><b>☰</b>목록</button>
  <button data-v="settings"><b>⚙</b>설정</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
